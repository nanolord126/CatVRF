# Alertmanager Configuration for CatVRF
# Поддержка: Telegram, Slack, Email, Webhook

global:
  # Slack webhook URL
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
  
  # SMTP configuration for Email
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@catvrf.ru'
  smtp_auth_username: 'alerts@catvrf.ru'
  smtp_auth_password: 'YOUR_APP_PASSWORD'
  smtp_require_tls: true

# Route configuration
route:
  # Default receiver
  receiver: 'default'
  
  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']
  
  # Wait for 30 seconds before sending first notification
  group_wait: 30s
  
  # Wait for 5 minutes between notifications for same group
  group_interval: 5m
  
  # Repeat notification every 4 hours
  repeat_interval: 4h
  
  # Child routes
  routes:
    # Critical alerts - all channels
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: false
    
    # Warning alerts - Slack + Telegram
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: false
    
    # Info alerts - Slack only
    - match:
        severity: info
      receiver: 'info-alerts'
      continue: false
    
    # Supermarket specific alerts
    - match:
        vertical: supermarket
      receiver: 'supermarket-alerts'
      group_by: ['alertname', 'vertical', 'queue']
      continue: true
    
    # CRM specific alerts
    - match:
        service: crm
      receiver: 'crm-alerts'
      continue: true

    # BigData pipeline alerts
    - match:
        vertical: bigdata
        severity: critical
      receiver: 'bigdata-critical'
      continue: false

    - match:
        vertical: bigdata
      receiver: 'bigdata-alerts'
      continue: true

# Receivers configuration
receivers:
  # Default receiver - Slack only
  - name: 'default'
    slack_configs:
      - channel: '#catvrf-alerts'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: '{{ template "slack.default.text" . }}'
        actions:
          - type: button
            text: 'View in Grafana'
            url: '{{ (index .Alerts 0).Annotations.grafana }}'
          - type: button
            text: 'Silence'
            url: '{{ template "__alertmanagerSilenceURL" . }}'
  
  # Critical alerts - All channels (Telegram, Slack, Email, Webhook)
  - name: 'critical-alerts'
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: 'YOUR_ADMIN_CHAT_ID'
        parse_mode: 'HTML'
        message: '{{ template "telegram.default.html" . }}'
        send_resolved: true
    
    slack_configs:
      - channel: '#catvrf-critical'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .CommonLabels.alertname }}'
        text: '{{ template "slack.critical.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        actions:
          - type: button
            text: 'Acknowledge'
            url: '{{ template "__alertmanagerSilenceURL" . }}'
    
    email_configs:
      - to: 'oncall@catvrf.ru,devops@catvrf.ru'
        subject: '🚨 CRITICAL: {{ .CommonLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'
        send_resolved: true
    
    webhook_configs:
      - url: 'https://your-oncall-system.com/api/v1/alerts'
        send_resolved: true
        http_config:
          bearer_token: 'YOUR_ONCALL_TOKEN'
  
  # Warning alerts - Slack + Telegram
  - name: 'warning-alerts'
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: 'YOUR_TELEGRAM_CHAT_ID'
        parse_mode: 'HTML'
        message: '{{ template "telegram.warning.html" . }}'
        send_resolved: true
    
    slack_configs:
      - channel: '#catvrf-warnings'
        send_resolved: true
        title: '⚠️ WARNING: {{ .CommonLabels.alertname }}'
        text: '{{ template "slack.default.text" . }}'
        color: 'warning'
  
  # Info alerts - Slack only
  - name: 'info-alerts'
    slack_configs:
      - channel: '#catvrf-info'
        send_resolved: false
        title: 'ℹ️ INFO: {{ .CommonLabels.alertname }}'
        text: '{{ template "slack.default.text" . }}'
        color: '#36a64f'
  
  # Supermarket specific alerts - All messaging platforms
  - name: 'supermarket-alerts'
    slack_configs:
      - channel: '#supermarket-alerts'
        send_resolved: true
        title: 'Supermarket: {{ .CommonLabels.alertname }}'
        text: '{{ template "slack.supermarket.text" . }}'
    
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: 'YOUR_SUPERMARKET_CHAT_ID'
        parse_mode: 'HTML'
        message: '{{ template "telegram.supermarket.html" . }}'
        send_resolved: true
  
  # CRM specific alerts
  - name: 'crm-alerts'
    slack_configs:
      - channel: '#crm-alerts'
        send_resolved: true
        title: 'CRM: {{ .CommonLabels.alertname }}'
        text: '{{ template "slack.crm.text" . }}'
    
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: 'YOUR_CRM_CHAT_ID'
        parse_mode: 'HTML'
        message: '{{ template "telegram.crm.html" . }}'
        send_resolved: true
    
    email_configs:
      - to: 'crm-team@catvrf.ru'
        subject: 'CRM Alert: {{ .CommonLabels.alertname }}'
        html: '{{ template "email.crm.html" . }}'
        send_resolved: true

  # BigData critical alerts - PagerDuty + Telegram + Slack
  - name: 'bigdata-critical'
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: 'YOUR_BIGDATA_ONCALL_CHAT_ID'
        parse_mode: 'HTML'
        message: '🚨 BIGDATA CRITICAL: {{ .CommonLabels.alertname }}{{ range .Alerts }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true

    slack_configs:
      - channel: '#catvrf-bigdata-critical'
        send_resolved: true
        title: '🚨 BIGDATA CRITICAL: {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'danger'
        actions:
          - type: button
            text: 'Grafana'
            url: '{{ (index .Alerts 0).Annotations.grafana }}'
          - type: button
            text: 'Runbook'
            url: '{{ (index .Alerts 0).Annotations.runbook }}'

    webhook_configs:
      - url: 'https://your-pagerduty.com/api/v1/alerts'
        send_resolved: true
        http_config:
          bearer_token: 'YOUR_PAGERDUTY_TOKEN'

  # BigData general alerts - Slack + Telegram
  - name: 'bigdata-alerts'
    slack_configs:
      - channel: '#catvrf-bigdata'
        send_resolved: true
        title: 'BigData: {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: 'YOUR_BIGDATA_CHAT_ID'
        parse_mode: 'HTML'
        message: '⚠️ BIGDATA: {{ .CommonLabels.alertname }}{{ range .Alerts }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true

# Inhibition rules - suppress less critical alerts when more critical fire
inhibit_rules:
  # Inhibit warning alerts when critical alerts fire for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']

  # Inhibit info alerts when warning/critical fire
  - source_match_re:
      severity: 'warning|critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster']

# Silence Rules for CatVRF
silences:
  # ========== Постоянные Silence ==========

  - name: "Maintenance Window"
    matchers:
      - name: alertname
        value: ".*Maintenance.*"
        isRegex: true
    createdBy: "system"
    comment: "Плановое обслуживание"

  - name: "Supermarket Deployment Silence"
    matchers:
      - name: alertname
        value: "SupermarketHighQueueOverload|HighFailedJobs"
        isRegex: true
      - name: severity
        value: warning
    duration: 30m
    comment: "Silence во время деплоя Supermarket"

  - name: "Ignore ColdChain under 30 jobs"
    matchers:
      - name: alertname
        value: "ColdChainJobsStuck"
      - name: supermarket_cold_chain_jobs
        value: "<30"
    comment: "Не спамить, пока мало заказов"

  - name: "CRMSync - Known Issue"
    matchers:
      - name: alertname
        value: "CRMSyncFailing"
    duration: 1h
    comment: "Временная проблема с CRM (до фикса)"

  - name: "Night Silence (low priority)"
    matchers:
      - name: severity
        value: warning
    time_intervals:
      - times:
          - start_time: "23:00"
            end_time: "07:00"
    comment: "Низкоприоритетные алерты ночью"

  # ========== Быстрые Silence для деплоя ==========

  - name: "Deployment Silence"
    matchers:
      - name: severity
        value: warning
    duration: 45m
    comment: "Деплой новой версии Supermarket"

  - name: "Supermarket-High Maintenance"
    matchers:
      - name: queue
        value: supermarket-high
    duration: 2h
    comment: "Техработы на cold chain доставке"

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'
