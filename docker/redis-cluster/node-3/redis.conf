# Redis Cluster Configuration - Node 3 (Master)
# CatVRF 2026 Production
# Port: 7003

# Network
port 7003
bind 0.0.0.0
protected-mode no

# Cluster
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-require-full-coverage no
cluster-migration-barrier 1

# Persistence
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
save 900 1
save 300 10
save 60 10000

# Memory
maxmemory 4gb
maxmemory-policy allkeys-lru

# PubSub / WebSocket Optimization
client-output-buffer-limit pubsub 64mb 128mb 60
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 256mb 60

# Security
requirepass SuperSecretPass123!
masterauth SuperSecretPass123!

# Logging
loglevel notice
logfile ""

# Timeout
timeout 0
tcp-keepalive 300

# Performance
tcp-backlog 511
databases 16
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Cluster Bus Port (port + 10000)
cluster-port 17003
