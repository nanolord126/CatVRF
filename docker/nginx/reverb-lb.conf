upstream reverb_backend {
    # Reverb servers for WebSocket load balancing
    server reverb-1:6001 max_fails=3 fail_timeout=30s;
    server reverb-2:6001 max_fails=3 fail_timeout=30s;
    server reverb-3:6001 max_fails=3 fail_timeout=30s;
    server reverb-4:6001 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # WebSocket upgrade endpoint with sticky sessions
    location / {
        proxy_pass http://reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sticky sessions via cookie
        proxy_cookie_path / "/";
        
        # WebSocket-specific timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Buffering disabled for WebSocket
        proxy_buffering off;
        proxy_request_buffering off;

        # TCP optimizations for WebSocket
        tcp_nodelay on;
        tcp_nopush on;
    }

    # Reverb-specific routes
    location /apps {
        proxy_pass http://reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
