# ═══════════════════════════════════════════════════════════════
# NGINX LOAD BALANCER - WebSocket Scaling with Sticky Sessions
# ═══════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format websocket '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $connection '
                        '$upstream_addr $upstream_response_time '
                        '$request_time $upstream_status';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream for Reverb WebSocket servers
    upstream reverb_backend {
        # Sticky sessions by IP (ip_hash)
        ip_hash;

        # Reverb instances
        server reverb-1:6001 max_fails=3 fail_timeout=30s weight=1;
        server reverb-2:6001 max_fails=3 fail_timeout=30s weight=1;
        server reverb-3:6001 max_fails=3 fail_timeout=30s weight=1;
        server reverb-4:6001 max_fails=3 fail_timeout=30s weight=1;

        # Keepalive connections to upstream
        keepalive 32;
    }

    # Upstream for Laravel application
    upstream laravel_backend {
        least_conn;
        
        server host.docker.internal:8000 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=websocket_limit:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=websocket_conn:10m;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # WebSocket endpoint - Reverb
        location / {
            # Rate limiting
            limit_req zone=websocket_limit burst=200 nodelay;
            limit_conn websocket_conn 50;

            # WebSocket upgrade headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts for WebSocket
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # Buffering disabled for WebSocket
            proxy_buffering off;
            proxy_cache off;

            # Proxy to Reverb backend
            proxy_pass http://reverb_backend;

            # Logging
            access_log /var/log/nginx/websocket_access.log websocket;
        }

        # Laravel application endpoint
        location /api/ {
            proxy_pass http://laravel_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Metrics endpoint for Prometheus
        location /metrics {
            proxy_pass http://laravel_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Restrict access to metrics (optional - add IP whitelist)
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 192.168.0.0/16;
            # deny all;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # HTTPS server (uncomment and configure SSL certificates)
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # ... same location blocks as HTTP server
    # }
}
