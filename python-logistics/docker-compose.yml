version: '3.8'

services:
  logistics-inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catvrf-logistics-inference
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=CatVRF Logistics Inference API
      - APP_VERSION=2.0.0
      - DEBUG=false
      - ENVIRONMENT=production
      
      # ClickHouse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      
      # Redis (for Laravel integration)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      
      # ML Models
      - MODELS_DIR=/app/models
      - ONNX_INFERENCE_THREADS=4
      
      # Server
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - LOG_TO_FILE=true
      - LOG_FILE_PATH=/app/logs/inference.log
      
      # Agentic AI
      - ENABLE_AGENT=true
      - AGENT_LLM_PROVIDER=openai
      - AGENT_LLM_MODEL=gpt-4-turbo
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - catvrf-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: catvrf-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ../../database/clickhouse:/docker-entrypoint-initdb.d:ro
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks:
      - catvrf-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: redis:7-alpine
    container_name: catvrf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - catvrf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  catvrf-network:
    driver: bridge

volumes:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
