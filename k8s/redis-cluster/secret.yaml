# Kubernetes Secret for Redis Cluster Authentication
# Production 2026 - CatVRF
# WARNING: Replace with actual secrets from your secret management system
# (e.g., AWS Secrets Manager, Azure Key Vault, HashiCorp Vault)

apiVersion: v1
kind: Secret
metadata:
  name: redis-cluster-secret
  namespace: catvrf-prod
type: Opaque
data:
  # Base64 encoded password: SuperSecretPass123!
  # echo -n "SuperSecretPass123!" | base64
  redis-password: U3VwZXJTZWNyZXRQYXNzMTIzIQ==
stringData:
  # Alternative: use stringData for plain text (Kubernetes will encode it)
  # redis-password: "SuperSecretPass123!"
