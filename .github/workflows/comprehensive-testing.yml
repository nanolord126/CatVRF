    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup k6
        uses: grafana/k6-action@v0.3.1
      
      - name: Run load tests
        run: k6 run k6/crash-test-medical.js

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit
      
      - name: Download feature coverage
        uses: actions/download-artifact@v4
        with:
          name: feature-coverage
          path: coverage/feature
      
      - name: Generate coverage badge
        run: |
          echo "Coverage badge generation placeholder"
          # Use coverage-badge package or custom script here
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
