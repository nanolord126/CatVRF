name: Comprehensive Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, pcntl
          coverage: xdebug
      
      - name: Copy .env
        run: cp .env.example .env
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      
      - name: Run migrations
        run: php artisan migrate --force
      
      - name: Run unit tests
        run: vendor/bin/pest --testsuite=Unit --coverage --coverage-html=coverage/unit
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit

  feature-tests:
    name: Feature Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
