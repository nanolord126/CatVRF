name: Testing Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, redis
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run Pest tests
        run: vendor/bin/pest --coverage --min=80

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  medical-coverage-gate:
    name: Medical Coverage Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Medical domain tests with coverage
        run: |
          vendor/bin/pest --filter=Medical --coverage
          
          # Check coverage threshold (75% minimum for Medical)
          COVERAGE=$(php -r "
          \$xml = simplexml_load_file('coverage.xml');
          \$metrics = \$xml->project->metrics;
          echo (string)\$metrics['coveredelements'] / (string)\$metrics['elements'] * 100;
          ")
          
          COVERAGE_INT=$(echo "$COVERAGE" | cut -d. -f1)
          if [ $COVERAGE_INT -lt 75 ]; then
            echo "Medical coverage is $COVERAGE%, minimum required is 75%"
            exit 1
          fi
          
          echo "Medical coverage is $COVERAGE% ✓"

  payment-coverage-gate:
    name: Payment Coverage Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Payment domain tests with coverage
        run: |
          vendor/bin/pest --filter=Payment --coverage
          
          # Check coverage threshold (75% minimum for Payment)
          COVERAGE=$(php -r "
          \$xml = simplexml_load_file('coverage.xml');
          \$metrics = \$xml->project->metrics;
          echo (string)\$metrics['coveredelements'] / (string)\$metrics['elements'] * 100;
          ")
          
          COVERAGE_INT=$(echo "$COVERAGE" | cut -d. -f1)
          if [ $COVERAGE_INT -lt 75 ]; then
            echo "Payment coverage is $COVERAGE%, minimum required is 75%"
            exit 1
          fi
          
          echo "Payment coverage is $COVERAGE% ✓"

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: test-suite
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Infection
        run: composer require --dev infection/infection

      - name: Run mutation tests for Medical domain
        run: |
          vendor/bin/infection --filter="App\Domains\Medical" --min-msi=90 --min-covered-msi=95
          
          # Check if mutation score threshold met
          if [ $? -ne 0 ]; then
            echo "Medical mutation score below 90% threshold"
            exit 1
          fi

      - name: Run mutation tests for Payment domain
        run: |
          vendor/bin/infection --filter="App\Domains\Payment" --min-msi=90 --min-covered-msi=95
          
          # Check if mutation score threshold met
          if [ $? -ne 0 ]; then
            echo "Payment mutation score below 90% threshold"
            exit 1
          fi

      - name: Upload mutation report
        uses: actions/upload-artifact@v3
        with:
          name: mutation-report
          path: infection-log.html

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, redis

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Start Redis
        uses: supercharge/redis-github-action@1.5.0

      - name: Run Contract tests
        run: vendor/bin/pest --testsuite=Contract

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, phpstan, php-cs-fixer, pint

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [test-suite, medical-coverage-gate, payment-coverage-gate, mutation-testing, contract-tests, static-analysis]
    if: always()
    
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.test-suite.result }}" != "success" ] || \
             [ "${{ needs.medical-coverage-gate.result }}" != "success" ] || \
             [ "${{ needs.payment-coverage-gate.result }}" != "success" ] || \
             [ "${{ needs.mutation-testing.result }}" != "success" ] || \
             [ "${{ needs.contract-tests.result }}" != "success" ] || \
             [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "❌ Quality gates failed"
            echo "Test Suite: ${{ needs.test-suite.result }}"
            echo "Medical Coverage: ${{ needs.medical-coverage-gate.result }}"
            echo "Payment Coverage: ${{ needs.payment-coverage-gate.result }}"
            echo "Mutation Testing: ${{ needs.mutation-testing.result }}"
            echo "Contract Tests: ${{ needs.contract-tests.result }}"
            echo "Static Analysis: ${{ needs.static-analysis.result }}"
            exit 1
          fi
          
          echo "✅ All quality gates passed"
